<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="workflow-title workflow-desc">
  <title id="workflow-title">Visual review workflow</title>
  <desc id="workflow-desc">A four-stage workflow from intake through render and review to resolution, with an emphasized rollback path from resolution to render.</desc>
  <defs>
    <linearGradient id="panel-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="rollback-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>
  <rect width="1200" height="720" rx="28" fill="#f1f5f9"/>
  <text x="64" y="82" fill="#0f172a" font-family="Arial, sans-serif" font-size="34" font-weight="700">Release review workflow</text>
  <text x="64" y="120" fill="#475569" font-family="Arial, sans-serif" font-size="20">Select a region to discuss ownership, risk, or rollback behavior.</text>

  <g aria-label="Intake stage">
    <rect x="64" y="190" width="240" height="250" rx="20" fill="url(#panel-fill)" stroke="#3b82f6" stroke-width="4"/>
    <circle cx="104" cy="235" r="18" fill="#2563eb"/>
    <text x="140" y="244" fill="#0f172a" font-family="Arial, sans-serif" font-size="26" font-weight="700">Intake</text>
    <text x="92" y="310" fill="#334155" font-family="Arial, sans-serif" font-size="19">PR or branch source</text>
    <text x="92" y="350" fill="#334155" font-family="Arial, sans-serif" font-size="19">Access verified</text>
    <text x="92" y="390" fill="#334155" font-family="Arial, sans-serif" font-size="19">Artifact detected</text>
  </g>

  <g aria-label="Render stage">
    <rect x="344" y="190" width="240" height="250" rx="20" fill="url(#panel-fill)" stroke="#8b5cf6" stroke-width="4"/>
    <circle cx="384" cy="235" r="18" fill="#7c3aed"/>
    <text x="420" y="244" fill="#0f172a" font-family="Arial, sans-serif" font-size="26" font-weight="700">Render</text>
    <text x="372" y="310" fill="#334155" font-family="Arial, sans-serif" font-size="19">Content sanitized</text>
    <text x="372" y="350" fill="#334155" font-family="Arial, sans-serif" font-size="19">Occurrences mapped</text>
    <text x="372" y="390" fill="#334155" font-family="Arial, sans-serif" font-size="19">Controls attached</text>
  </g>

  <g aria-label="Review stage">
    <rect x="624" y="190" width="240" height="250" rx="20" fill="url(#panel-fill)" stroke="#f59e0b" stroke-width="4"/>
    <circle cx="664" cy="235" r="18" fill="#d97706"/>
    <text x="700" y="244" fill="#0f172a" font-family="Arial, sans-serif" font-size="26" font-weight="700">Review</text>
    <text x="652" y="310" fill="#334155" font-family="Arial, sans-serif" font-size="19">Region selected</text>
    <text x="652" y="350" fill="#334155" font-family="Arial, sans-serif" font-size="19">Thread created</text>
    <text x="652" y="390" fill="#334155" font-family="Arial, sans-serif" font-size="19">Owner notified</text>
  </g>

  <g aria-label="Resolve stage">
    <rect x="904" y="190" width="232" height="250" rx="20" fill="url(#panel-fill)" stroke="#22c55e" stroke-width="4"/>
    <circle cx="944" cy="235" r="18" fill="#16a34a"/>
    <text x="980" y="244" fill="#0f172a" font-family="Arial, sans-serif" font-size="26" font-weight="700">Resolve</text>
    <text x="932" y="310" fill="#334155" font-family="Arial, sans-serif" font-size="19">Change applied</text>
    <text x="932" y="350" fill="#334155" font-family="Arial, sans-serif" font-size="19">Anchor refreshed</text>
    <text x="932" y="390" fill="#334155" font-family="Arial, sans-serif" font-size="19">Decision recorded</text>
  </g>

  <path d="M304 315 H344" stroke="#475569" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M584 315 H624" stroke="#475569" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M864 315 H904" stroke="#475569" stroke-width="5" marker-end="url(#arrow)"/>

  <g aria-label="Rollback path">
    <path d="M1020 440 V560 H464 V448" fill="none" stroke="#dc2626" stroke-width="6" stroke-dasharray="14 10" marker-end="url(#rollback-arrow)"/>
    <rect x="650" y="520" width="226" height="72" rx="16" fill="#fff1f2" stroke="#fda4af" stroke-width="3"/>
    <text x="682" y="550" fill="#9f1239" font-family="Arial, sans-serif" font-size="18" font-weight="700">Rollback path</text>
    <text x="682" y="578" fill="#9f1239" font-family="Arial, sans-serif" font-size="16">Owner confirmation required</text>
  </g>

  <g aria-label="Review prompts">
    <rect x="64" y="510" width="500" height="142" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="92" y="552" fill="#0f172a" font-family="Arial, sans-serif" font-size="20" font-weight="700">Suggested annotation targets</text>
    <text x="92" y="592" fill="#475569" font-family="Arial, sans-serif" font-size="18">1. Who owns the handoff between Render and Review?</text>
    <text x="92" y="624" fill="#475569" font-family="Arial, sans-serif" font-size="18">2. Is the rollback route explicit enough?</text>
  </g>
</svg>
